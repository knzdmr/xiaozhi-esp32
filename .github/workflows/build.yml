name: Build My AtomS3R Cam

on:
  workflow_dispatch:
    inputs:
      board_name:
        description: 'Derlenecek kart klasörü (main/boards altındaki klasör adı)'
        required: true
        default: 'atoms3r-cam-m12-echo-base'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AtomS3R Cam
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build target board
        shell: bash
        env:
          BOARD: ${{ github.event.inputs.board_name || 'atoms3r-cam-m12-echo-base' }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ github.event.inputs.board_name || 'atoms3r-cam-m12-echo-base' }}
          path: build/merged-binary.bin
          if-no-files-found: error
